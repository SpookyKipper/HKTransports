name: hktransports
description: "HKTransports is a public transport app for Hong Kong, providing real-time bus, minibus, and MTR information."
publish_to: 'none'
version: 0.1.4+7

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  dynamic_color: ^2.1.0
  crypto: ^3.0.8
  material_ui: ^1.9.0
  material_3_expressive: ^1.2.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  http: ^1.6.0
  intl: ^0.20.3
  go_router: ^18.1.2
  objectbox: ^5.3.2
  objectbox_flutter_libs: ^5.3.2
  path_provider: ^2.1.6
  html: ^0.15.7
  webview_flutter: ^4.14.1
  pdfrx: ^2.11.0
  maplibre: ^0.3.7+1
  geolocator: ^14.1.2
  flutter_compass: ^0.8.1
  xml: ^7.1.0
  archive: ^4.6.0
  sqlite3: ^3.9.0
  connectivity_plus: ^7.3.1
  pointycastle: ^4.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/landsd.png
    - assets/images/route_arrow.png
    - assets/certs/godaddy_g2_bundle.pem
    # - assets/images/mapbox-logo-black.png
    # - assets/images/mapbox-logo-white.png

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#C5BEFF"
  adaptive_icon_foreground: "assets/images/logo_foreground.png"
  adaptive_icon_foreground_inset: 20