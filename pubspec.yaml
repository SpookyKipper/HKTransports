name: hktransports
description: "HKTransports is a public transport app for Hong Kong, providing real-time bus, minibus, and MTR information."
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.5
  chat_bubbles: ^1.7.0
  dynamik_theme: ^0.1.4
  package_info_plus: ^8.3.0
  shared_preferences: ^2.5.3
  flutter_phoenix: ^1.1.1
  url_launcher: ^6.3.2
  protocol_handler: ^0.2.0
  http: ^1.3.0
  intl: ^0.20.1
  cupertino_icons: ^1.0.8
  flutter_launcher_icons: ^0.14.4
  web: ^1.1.1
  share_handler: ^0.0.25
  fluttertoast: ^8.2.12
  flutter_linkify: ^6.0.0
  go_router: ^17.2.2
  rename_app: ^1.6.5
  flutter_map: 
    path: ./packages/modified/flutter_map-8.2.1
  latlong2: ^0.9.1
  hkbusapi:
    path: /home/kipper/Documents/GitKraken/hkbusapi
  objectbox: ^4.3.1
  objectbox_flutter_libs: any
  path_provider: ^2.1.5
  go_transitions: ^0.8.2
  desktop_webview_window: ^0.2.3
  window_manager: ^0.5.1
  spookyservices:
    path: /home/kipper/Documents/GitKraken/SpookyServices
  webview_flutter: ^4.13.0
  one_ui: 
    path: /home/kipper/Documents/GitKraken/one_ui_flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  change_app_package_name: ^1.5.0
  build_runner: any
  objectbox_generator: any

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    # - assets/images/mapbox-logo-black.png
    # - assets/images/mapbox-logo-white.png
    - assets/images/maptiler.png
    - assets/images/mapMarkers/kmb.png

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#000000" # or your background color
  adaptive_icon_foreground: "assets/icon/icon.png"