name: hktransports
description: "HKTransports is a public transport app for Hong Kong, providing real-time bus, minibus, and MTR information."
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.5+1
  dynamic_color: ^2.1.0
  crypto: ^3.0.8
  material_ui: ^1.9.0
  material_3_expressive: ^1.2.0
  package_info_plus: ^9.0.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  protocol_handler: ^0.2.0
  http: ^1.6.0
  intl: ^0.20.3
  cupertino_icons: ^2.0.0
  flutter_launcher_icons: ^0.14.4
  web: ^1.1.2
  share_handler: ^0.0.25
  fluttertoast: ^10.0.2
  flutter_linkify: ^6.0.0
  go_router: ^18.1.2
  rename_app: ^1.6.6
  hkbusapi:
    path: /home/kipper/Documents/GitKraken/hkbusapi
  objectbox: ^4.3.1
  objectbox_flutter_libs: ^4.3.1
  path_provider: ^2.1.6
  html: ^0.15.7
  webview_flutter: ^4.14.1
  pdfrx: ^2.11.0
  maplibre: ^0.3.7+1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0
  build_runner: ^2.7.1
  objectbox_generator: ^4.3.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/landsd.png
    - assets/images/route_arrow.png
    # - assets/images/mapbox-logo-black.png
    # - assets/images/mapbox-logo-white.png
    - assets/images/mapMarkers/kmb.png

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#C5BEFF"
  adaptive_icon_foreground: "assets/images/logo_foreground.png"